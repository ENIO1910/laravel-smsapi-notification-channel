name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        illuminate: ['^11.0', '^12.0', '^13.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.illuminate }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.illuminate }}-

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Resolve dependencies for target Laravel
        run: |
          composer require --no-interaction --no-update \
            "illuminate/notifications:${{ matrix.illuminate }}" \
            "illuminate/support:${{ matrix.illuminate }}"
          composer update --no-interaction --no-progress --prefer-dist --with-all-dependencies

      - name: Run Pint
        run: composer format:test

      - name: Run Rector
        run: composer rector:dry

      - name: Run tests
        run: composer test
